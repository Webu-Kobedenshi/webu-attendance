# 設計意図:
# - 毎週木曜 08:43 JST = 水曜 23:43 UTC に Poll 投稿
# - workflow_dispatch で手動実行も可能（テスト・障害時の再実行用）
# - キャッシュで依存解決を高速化
# - 失敗したら GitHub Actions の通知でわかる前提（追加通知は当面なし）
# - cron の分は「00 分ちょうど」を避ける: GitHub Actions の schedule は
#   top of the hour に世界中の job が集中して大幅遅延する事象があるため、
#   半端な分（:43）にオフセットして遅延を抑える

name: Post Attendance Poll

on:
  schedule:
    # cron は UTC。木曜 08:43 JST = 水曜 23:43 UTC（水曜 = 3）
    - cron: "43 23 * * 3"
  workflow_dispatch: # 手動実行を有効化

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # ハングアップ防止
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm" # package-lock.json をキーに依存をキャッシュ

      - name: Install dependencies
        run: npm ci

      - name: Run post-poll script
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY_JSON }}
        run: node --import tsx scripts/post-poll.ts
