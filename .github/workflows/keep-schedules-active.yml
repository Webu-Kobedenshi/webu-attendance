# 公開リポジトリは60日間更新がないと定期ワークフローが無効化されるため、
# 確定済み活動期間中だけ月1回コミットを作成して定期実行を維持する。
name: Keep Scheduled Workflows Active

on:
  schedule:
    - cron: "17 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-active:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep schedules active during the confirmed activity period
        shell: bash
        run: |
          today="$(TZ=Asia/Tokyo date +%F)"
          if [[ "$today" > "2026-12-17" ]]; then
            echo "確定済み活動期間を過ぎたため更新しません"
            exit 0
          fi

          printf '%s\n' "$today" > .github/schedule-keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/schedule-keepalive
          git commit -m "定期実行を有効に保つ"
          git push
