# 設計意図:
# - 毎週木曜 17:13 JST = 木曜 08:13 UTC に結果集計
# - Poll 締切（17:00）の十数分後に集計実行（遅延を吸収）
# - 構成は post-poll.yml とほぼ同じ
# - 集計スクリプトを呼ぶ点だけ異なる
# - cron の分は「00 分・05 分」など綺麗な時刻を避ける: GitHub Actions の
#   schedule は top of the hour 付近に世界中の job が集中して大幅遅延する
#   事象があるため、半端な分（:13）にオフセットして遅延を抑える

name: Collect Attendance Poll

on:
  schedule:
    # cron は UTC。木曜 17:13 JST = 木曜 08:13 UTC（木曜 = 4）
    - cron: "13 8 * * 4"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run collect-poll script
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY_JSON }}
        run: node --import tsx scripts/collect-poll.ts
